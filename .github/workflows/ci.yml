# CI pipeline (doc 10 §10.6).
#
# Ordered fastest-failing-first so a formatting mistake costs 15 seconds, not
# four minutes. Two gates are unusual and deliberate:
#
#   architecture   `import-linter` fails the build on a layer violation. Without
#                  it, "clean architecture" is an aspiration rather than a
#                  property (doc 7 §7.9).
#
#   no-network     the default test run makes zero outbound calls and spends zero
#                  API quota (NFR-T3). Enforced, not trusted.
#
#   smoke eval     FR-E6's regression gate: a 10-paper subset is retrieved and
#                  scored on CPU, and the build fails if any metric drops more
#                  than 0.05 below the committed baseline (D82). It is the ONLY
#                  job that downloads a model — NFR-T3 governs the default test
#                  run, which still makes zero network calls — and the download
#                  is cached, so it arrives once per cache lifetime.
#
# GPU tests are marked and skipped here — there is no free GPU runner.
#
# Tests that load a real encoder are also skipped, because the model is a 419 MB
# download and NFR-T3 requires the default test run to make zero network calls.
# They run on any machine whose HuggingFace cache already holds it. The cost is
# real and worth stating plainly: CI does NOT verify the CPU inference path
# DEP-9 describes — it verifies everything around it (prefixes, precision
# selection, version stamping, batching) with the model itself skipped.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint · types · architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project
        # --locked fails the build if uv.lock is stale relative to
        # pyproject.toml. Reproducible installs are an FR-E4 requirement
        # (doc 7 §7.13), so a drifted lockfile is a build error, not a
        # silent re-resolution.
        run: uv sync --locked --extra dev

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src

      # The gate that turns a design claim into a build property.
      - name: Architecture contracts
        run: uv run lint-imports

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project
        # --locked fails the build if uv.lock is stale relative to
        # pyproject.toml. Reproducible installs are an FR-E4 requirement
        # (doc 7 §7.13), so a drifted lockfile is a build error, not a
        # silent re-resolution.
        run: uv sync --locked --extra dev

      # `-m "not gpu"` is the only exclusion. Integration tests bring their own
      # services up via testcontainers, so they need no separate job.
      - name: Run tests
        run: >-
          uv run pytest -m "not gpu"
          --cov=scholiast --cov-report=xml --cov-report=term
          --cov-fail-under=75

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: Smoke eval (FR-E6 regression gate)
    runs-on: ubuntu-latest
    services:
      # The same pinned image docker-compose runs. `qdrant-client` refuses a
      # server more than one minor away, so letting CI and dev drift apart would
      # surface as an inexplicable failure rather than as a version error.
      qdrant:
        image: qdrant/qdrant:v1.18.0@sha256:b3063c673f3973877c038eeecc392bad5011f072ee7892b56c9a8e204a3bdea9
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project
        run: uv sync --locked --extra dev

      # 419 MB, fetched once per cache lifetime. Keyed on the model so bumping
      # the encoder invalidates it rather than silently scoring the old weights.
      - name: Cache the encoder
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-base-en-v1.5-${{ runner.os }}

      # `services:` starts the container but does not wait for it to answer. The
      # eval would otherwise fail on connection refused and read as a regression.
      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:6333/readyz >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Qdrant never became ready" >&2
          exit 1

      # Exits non-zero on a regression beyond the tolerance; a rise is reported
      # and passes, because FR-E6 asks for a regression gate (D82).
      - name: Smoke eval
        run: uv run eval --smoke

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history to scan commits

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project
        # --locked fails the build if uv.lock is stale relative to
        # pyproject.toml. Reproducible installs are an FR-E4 requirement
        # (doc 7 §7.13), so a drifted lockfile is a build error, not a
        # silent re-resolution.
        run: uv sync --locked --extra dev

      - name: Audit dependencies
        run: uvx pip-audit --strict --progress-spinner off

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
