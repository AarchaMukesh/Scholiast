# CI pipeline (doc 10 §10.6).
#
# Ordered fastest-failing-first so a formatting mistake costs 15 seconds, not
# four minutes. Two gates are unusual and deliberate:
#
#   architecture   `import-linter` fails the build on a layer violation. Without
#                  it, "clean architecture" is an aspiration rather than a
#                  property (doc 7 §7.9).
#
#   no-network     the default test run makes zero outbound calls and spends zero
#                  API quota (NFR-T3). Enforced, not trusted.
#
#   smoke eval     FR-E6's regression gate: a 10-paper subset is retrieved and
#                  scored on CPU, and the build fails if any metric drops more
#                  than 0.05 below the committed baseline (D82). It is the ONLY
#                  job that downloads a model — NFR-T3 governs the default test
#                  run, which still makes zero network calls — and the download
#                  is cached, so it arrives once per cache lifetime.
#
# GPU tests are marked and skipped here — there is no free GPU runner.
#
# Tests that load a real encoder are also skipped, because the model is a 419 MB
# download and NFR-T3 requires the default test run to make zero network calls.
# They run on any machine whose HuggingFace cache already holds it. The cost is
# real and worth stating plainly: CI does NOT verify the CPU inference path
# DEP-9 describes — it verifies everything around it (prefixes, precision
# selection, version stamping, batching) with the model itself skipped.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint · types · architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project
        # --locked fails the build if uv.lock is stale relative to
        # pyproject.toml. Reproducible installs are an FR-E4 requirement
        # (doc 7 §7.13), so a drifted lockfile is a build error, not a
        # silent re-resolution.
        run: uv sync --locked --extra dev

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src

      # The gate that turns a design claim into a build property.
      - name: Architecture contracts
        run: uv run lint-imports

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      # D90. NFR-T5 calls the tenant-isolation suite "mandatory, non-skippable",
      # and part of it was skipping here: layer 3's leakage test needs a live
      # Qdrant, this job declared no services, and the one job that had Qdrant
      # runs the smoke eval instead. A skipped isolation test and a passing one
      # look identical in a green build, which for a negative suite is the worst
      # place to be trusting. Same digest-pinned image as the smoke job, because
      # `qdrant-client` refuses a server more than one minor away and a drift
      # between CI and dev would surface as an inexplicable failure.
      qdrant:
        image: qdrant/qdrant:v1.18.0@sha256:b3063c673f3973877c038eeecc392bad5011f072ee7892b56c9a8e204a3bdea9
        ports:
          - 6333:6333
      # D128. The discovery cache's tests, and the Redis GPU-gate tests that have
      # skipped here since M3, gate on a live Redis at collection time. Same pinned
      # image as compose. Service containers take no command arguments, so this is
      # the image's defaults, not the cache's cap; nothing in the suite depends on
      # the cap. The health check makes the runner wait for it before any step.
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project
        # --locked fails the build if uv.lock is stale relative to
        # pyproject.toml. Reproducible installs are an FR-E4 requirement
        # (doc 7 §7.13), so a drifted lockfile is a build error, not a
        # silent re-resolution.
        run: uv sync --locked --extra dev

      # `services:` starts the container but does not wait for it to answer, and
      # the suite's `needs_qdrant` gate probes `/readyz` at COLLECTION time — so
      # losing this race would not fail the build, it would silently skip the
      # tests D90 added the service for.
      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:6333/readyz >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Qdrant never became ready" >&2
          exit 1

      # `-m "not gpu"` is the only exclusion. Postgres comes from testcontainers
      # per suite; Qdrant is the service above. Tests needing GROBID, Ollama, the
      # fixture PDFs or a cached encoder still skip on their own gates, so
      # NFR-T3's zero-network-calls property is untouched.
      - name: Run tests
        run: >-
          uv run pytest -m "not gpu"
          --cov=scholiast --cov-report=xml --cov-report=term
          --cov-fail-under=75

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: Smoke eval (FR-E6 regression gate)
    runs-on: ubuntu-latest
    services:
      # The same pinned image docker-compose runs. `qdrant-client` refuses a
      # server more than one minor away, so letting CI and dev drift apart would
      # surface as an inexplicable failure rather than as a version error.
      qdrant:
        image: qdrant/qdrant:v1.18.0@sha256:b3063c673f3973877c038eeecc392bad5011f072ee7892b56c9a8e204a3bdea9
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project
        # The only job that needs the ML stack: the eval loads the encoder. On
        # Linux `ml` resolves to the CPU torch wheel (see [tool.uv.sources]).
        run: uv sync --locked --extra dev --extra ml

      # 419 MB, fetched once per cache lifetime. Keyed on the model so bumping
      # the encoder invalidates it rather than silently scoring the old weights.
      - name: Cache the encoder
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-base-en-v1.5-${{ runner.os }}

      # `services:` starts the container but does not wait for it to answer. The
      # eval would otherwise fail on connection refused and read as a regression.
      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:6333/readyz >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Qdrant never became ready" >&2
          exit 1

      # Exits non-zero on a regression beyond the tolerance; a rise is reported
      # and passes, because FR-E6 asks for a regression gate (D82).
      - name: Smoke eval
        run: uv run eval --smoke

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    # On a pull_request event gitleaks-action lists the PR's commits through the
    # API, which the repo's default token cannot do. Granted here, per job, so
    # no other job gains it. A push event scans with `git log` and never needs it.
    permissions:
      contents: read       # checkout
      pull-requests: read  # GET /pulls/{n}/commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history to scan commits

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # Audits the LOCKFILE, every extra included. A bare `uvx pip-audit` audits
      # the interpreter it runs in — its own throwaway tool env — so it passed
      # whatever uv.lock held; the project sync that used to precede it was never
      # read. `--locked` still fails the build on a stale lock.
      #
      # `-s osv`: PyPI's service cannot resolve a local version tag and, under
      # --strict, errors on torch `2.11.0+cpu`. Markers are evaluated for the
      # runner, so the Windows-only `+cu128` entry is not audited directly; it
      # is the same torch release as the `+cpu` one, with the same advisories.
      #
      # Each ignore is scoped, reasoned, and goes away with a torch upgrade:
      #   PYSEC-2025-194 (GHSA-rrmf-rvhw-rf47) — torch <2.13, memory corruption
      #     via torch.jit.script. Unreachable: nothing in src/, sentence-
      #     transformers, or the BERT / XLM-RoBERTa code the bge models use
      #     calls jit.script.
      #   PYSEC-2026-3447 (GHSA-h35f-9h28-mq5c) — setuptools <83, MANIFEST.in
      #     exclusion bypass when building an sdist on macOS. Present only
      #     because torch 2.11 requires setuptools<82; nothing here builds an
      #     sdist with it (the project builds with hatchling).
      - name: Audit dependencies
        run: |
          uv export --locked --all-extras --no-emit-project \
            --format requirements.txt -o requirements-audit.txt
          uvx pip-audit -s osv --strict --progress-spinner off \
            --disable-pip --require-hashes -r requirements-audit.txt \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2026-3447

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
