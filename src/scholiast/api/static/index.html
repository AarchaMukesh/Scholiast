<!doctype html>
<!--
  The Scholiast interface (D37, D154).

  Vanilla HTML, one file of CSS, one of JS, no build step. D37 deferred doc 7
  §7.7's React/Vite/Tailwind stack deliberately, and the page has stayed small
  enough that it still earns its keep.

  Two views over one workspace panel: Read (ask questions of your papers, with
  evidence you can open) and Discover (search the sources, see why each result
  ranked where it did, add a paper and watch it index). A login view guards both
  (D154, closing D88).

  No inline script, style or event handler anywhere: the Content-Security-Policy
  these pages carry (D154) would refuse them, and third-party text from search
  results must never be able to become markup.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scholiast</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>Scholiast</h1>
        <p class="sub">
          Find papers, read them, and ask grounded questions. Every citation
          resolves to a span you can read; every ranking explains itself.
        </p>
      </div>
      <nav id="nav" class="nav" hidden aria-label="Views">
        <button id="view-read" type="button" class="tab" aria-pressed="true">Read</button>
        <button id="view-discover" type="button" class="tab" aria-pressed="false">Discover</button>
        <button id="logout" type="button" class="quiet">Log out</button>
      </nav>
    </header>

    <!-- D154: the page is useless without a session, so nothing else shows until
         there is one. Registration and login share the form. -->
    <section id="auth" class="auth" hidden aria-labelledby="auth-heading">
      <h2 id="auth-heading">Sign in</h2>
      <form id="auth-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required />
        <label for="password">Password (at least 12 characters to register)</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <div class="row">
          <button id="login" type="submit">Log in</button>
          <button id="register" type="button" class="quiet">Create account</button>
        </div>
      </form>
    </section>

    <main id="app" hidden data-view="read">
      <section id="library" aria-labelledby="library-heading">
        <h2 id="library-heading">Workspace</h2>

        <div class="row">
          <select id="workspace-select" aria-label="Workspace"></select>
          <button id="new-workspace" type="button">New</button>
        </div>

        <form id="upload-form">
          <label for="pdf">Add a paper (PDF, max 50 MB)</label>
          <input id="pdf" type="file" accept="application/pdf" required />
          <button type="submit">Upload</button>
        </form>

        <!-- NFR-U1: long operations show state. Papers appear here the moment
             they are queued and update as ingestion moves through its stages. -->
        <ul id="papers" class="papers"></ul>
      </section>

      <section id="chat" class="read-only" aria-labelledby="chat-heading">
        <h2 id="chat-heading">Ask</h2>
        <div id="transcript" class="transcript" aria-live="polite"></div>

        <form id="ask-form">
          <input
            id="question"
            type="text"
            placeholder="What problem does this paper address?"
            autocomplete="off"
            required
          />
          <button type="submit">Ask</button>
        </form>

        <!-- NFR-U4: uncertainty is visible rather than buried. Degradation
             flags and excluded papers land here, next to the answer. -->
        <div id="disclosure" class="disclosure" hidden></div>
      </section>

      <section id="evidence-panel" class="read-only" aria-labelledby="evidence-heading">
        <h2 id="evidence-heading">Evidence</h2>
        <p class="hint">
          The passages the answer was built from. Click one to read it in place.
        </p>
        <ol id="evidence" class="evidence"></ol>
      </section>

      <!-- FR-D1..D8: topic in, ranked and deduplicated papers out, each one able
           to say why it ranked where it did (FR-D5). -->
      <section id="discover" class="discover-only" aria-labelledby="discover-heading">
        <h2 id="discover-heading">Discover</h2>
        <form id="search-form">
          <div class="row">
            <input
              id="query"
              type="text"
              placeholder="A topic or a question, e.g. dense retrieval for open-domain QA"
              autocomplete="off"
              maxlength="500"
              required
              aria-label="Search query"
            />
            <button type="submit">Search</button>
          </div>
          <div class="filters">
            <label>From year <input id="year-from" type="number" min="1000" max="3000" /></label>
            <label>To year <input id="year-to" type="number" min="1000" max="3000" /></label>
            <label>Min. citations <input id="min-citations" type="number" min="0" /></label>
            <label>Venue contains <input id="venue" type="text" maxlength="200" /></label>
            <label>
              Sort
              <select id="sort">
                <option value="score">Best match</option>
                <option value="citations">Most cited</option>
                <option value="year">Newest</option>
              </select>
            </label>
          </div>
        </form>

        <!-- FR-D6: a source that did not answer is said, not hidden. -->
        <div id="search-status" class="search-status" aria-live="polite" hidden></div>
        <ol id="results" class="results"></ol>
        <p id="ranking-note" class="hint" hidden></p>
      </section>
    </main>

    <!-- The citation target (NFR-U3). Opened by clicking a citation or an
         evidence item; shows the section's text with the cited span marked. -->
    <dialog id="reader">
      <article>
        <h3 id="reader-title"></h3>
        <p id="reader-meta" class="meta"></p>
        <pre id="reader-text"></pre>
      </article>
      <form method="dialog"><button>Close</button></form>
    </dialog>

    <div id="toast" class="toast" hidden role="status"></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
